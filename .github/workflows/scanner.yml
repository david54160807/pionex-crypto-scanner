name: Pionex 4H Crypto Scanner V2.2

on:
  schedule:
    # 每 5 分鐘觸發一次輕量檢查；只有距離上次完整成功掃描滿 20 分鐘才掃描市場。
    - cron: "2-57/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

# 單一執行序列：掃描進行中時，GitHub 最多保留一個等待中的執行。
# 新的排程可能取代舊的等待執行；掃描完成後，保留的檢查會讀取最新 state.json。
concurrency:
  group: pionex-crypto-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Run scheduled check or full market scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_RUN_STARTED_AT: ${{ github.run_started_at }}
          SCAN_INTERVAL_MINUTES: "20"
          SEND_SCAN_SUMMARY: "true"
          LOG_LEVEL: "INFO"
        run: python main.py
